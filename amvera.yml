meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
  artifacts:
    ".next/standalone/*": /

run:
  command: HOSTNAME=0.0.0.0 node server.js
  containerPort: 3000
